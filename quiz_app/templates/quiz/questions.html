{% extends "layouts/base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto p-4">
    <!-- Barre de progression -->
    <div class="w-full bg-gray-200 rounded-full h-2.5 mb-4">
        <div class="bg-blue-600 h-2.5 rounded-full"
             style="width: {{ (progress / total) * 100 }}%"></div>
    </div>

    <!-- Timer -->
    <div id="timer-bar" class="h-1 bg-red-500 mb-4"
         data-time-limit="{{ question.time_limit }}"></div>

    <!-- Question -->
    <h2 class="text-xl font-bold mb-4">{{ question.text }}</h2>

    <!-- Options -->
    <form method="POST" class="space-y-3">
        {% for option in [question.option1, question.option2, question.option3, question.option4] %}
        <label class="flex items-center p-3 border rounded-lg hover:bg-gray-50 cursor-pointer">
            <input type="radio" name="answer" value="{{ loop.index }}" class="mr-2">
            {{ option }}
        </label>
        {% endfor %}
        <button type="submit" class="mt-4 bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
            Suivant
        </button>
    </form>
</div>
{% endblock %}
